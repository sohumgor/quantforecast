# Render Blueprint — deploys the backend only. The frontend deploys
# separately on Vercel (see documentation/deploy.md), since Next.js on
# Vercel gets a stable, always-warm public URL for free, whereas Render's
# free tier spins the frontend down on idle.
# https://render.com/docs/blueprint-spec
#
# Usage: in the Render dashboard, New -> Blueprint -> pick this repo. Render
# reads this file and creates the backend service with env vars wired up.
#
# Free-tier caveat: free web services have no persistent disk, so
# research/ (price cache, backtests, per-ticker lookup tables) is wiped
# every time the service restarts or wakes from idle — every ticker acts
# like a first-ever analysis again. To make backtests actually stick,
# upgrade the backend service to the "starter" plan and attach a disk:
#
#   plan: starter
#   disk:
#     name: research-data
#     mountPath: /app/research
#     sizeGB: 1

services:
  - type: web
    name: quantforecast-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: QFP_CORS_ALLOW_ORIGINS_CSV
        value: https://quantforecast.vercel.app
